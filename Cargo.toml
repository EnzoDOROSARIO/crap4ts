[package]
name = "crap4ts"
version = "0.1.0"
edition = "2024"
description = "CRAP scores for TypeScript functions, powered by Rust"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
